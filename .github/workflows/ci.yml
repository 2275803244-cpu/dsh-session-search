name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check plugin bundles
        run: |
          node --check lib/client.js
          node --check lib/index.js
      - name: Validate package.json
        run: node -e "const p=require('./package.json'); if(!p.dsh?.client || p.dsh.client.platform!=='web') throw new Error('dsh.client metadata missing'); if(!p.exports?.['./client']) throw new Error('exports[./client] missing'); console.log('package.json OK:', p.name, p.version);"
